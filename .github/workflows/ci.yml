name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coding-conventions:
    name: Coding conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Check formatting
        run: composer fmt:check

      - name: Lint
        run: composer lint -- --reporting-format=github

      - name: Static analysis
        run: composer analyze -- --reporting-format=github --minimum-fail-level=warning

  type-coverage:
    name: Type coverage (100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --ignore-platform-reqs

      - name: Check type coverage
        run: composer type-coverage

  tests:
    name: Tests (100% coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.5]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, intl, libxml
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run tests
        run: composer test
